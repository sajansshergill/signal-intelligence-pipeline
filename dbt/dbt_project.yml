# dbt/dbt_project.yml
name: threat_signal_pipeline
version: '1.0.0'
config-version: 2

profile: threat_signals

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  threat_signal_pipeline:
    bronze:
      +materialized: incremental
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold